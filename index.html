<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <h2>EMI Calculator</h2>
        <label for="principle">Principle Amount</label>
        <input type="number" id="principle" placeholder="Principle Amount">
        <br>
        <label for="months">Months</label>
        <input type="number" id="months" placeholder="Number of Months">
        <br>
        <label for="interest">Interest Rate</label>
        <input type="number" id="interest" placeholder="Interest Rate">
        <button onclick="calculateEMI()">Calculate</button>
        <br>
        <span id="resultcontainer" style="font-size: larger;"> ==</span>
    </div>
    <script src="index.js"></script>
</body>
</html>
